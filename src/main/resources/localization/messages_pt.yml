# !-----------------------------------------------------------------------------------------------!
#                              Bem-vindo ao arquivo de localização.
# !-----------------------------------------------------------------------------------------------!
#
#   A pasta localization/ armazena vários arquivos de localização. Use a convenção de nomenclatura
#   sugerida message_LANGUAGE.yml e então use a "SimpleLocalization" ou a classe "Lang" para
#   usar este arquivo.
#
#   1) CÓDIGOS DE COR são suportados com o caractere '&'.
#      - Para uso, veja http://minecraftwiki.net/wiki/Formatting_codes
#      - Quando você os usar, coloque aspas ao redor da mensagem assim: "Hello &cworld."
#       - Para usar cores HEX, use a sintaxe #123456: "Hello #123456world."
#
#   2) PARA OCULTAR qualquer mensagem, defina como 'none'.
#
#   3) Para CARACTERES UNICODE (emojis, símbolos, ..), salve o arquivo em codificação UTF-8. Veja
#      - https://github.com/${author}/${project.name}/wiki/Use-Right-Encoding
#
#   4) JSON é suportado. Adicione [JSON] antes da mensagem.
#
#   5) AVISO SOBRE JAVASCRIPT: Algumas de nossas mensagens são compiladas em tempo real com JavaScript.
#      Essas normalmente têm variáveis como "self" dentro delas. SE VOCÊ NÃO SABE PROGRAMAR
#      em JavaScript, tenha cuidado extra e não remova os parênteses () ou as variáveis!
#
# !-----------------------------------------------------------------------------------------------!

